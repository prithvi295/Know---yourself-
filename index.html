<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know Yourself</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  min-height: 100vh;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 25px;
  margin-top: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  margin: 10px 0 18px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #667eea;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.language-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.language-buttons button {
  background: #eee;
  color: #333;
}

.language-buttons button.active {
  background: #667eea;
  color: white;
}

.question {
  margin-bottom: 25px;
}

.question h3 {
  margin-bottom: 12px;
}

.option {
  display: block;
  padding: 13px;
  margin: 8px 0;
  background: #f5f5f5;
  border-radius: 10px;
  cursor: pointer;
}

.option:hover {
  background: #e9e9ff;
}

.option input {
  width: auto;
  margin: 0 8px 0 0;
}

.result {
  text-align: center;
}

.score {
  font-size: 40px;
  font-weight: bold;
  color: #667eea;
}

.trait {
  text-align: left;
  margin: 15px 0;
}

.trait-name {
  font-weight: bold;
  margin-bottom: 5px;
}

.bar {
  height: 12px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: #667eea;
}

.hidden {
  display: none;
}

.small {
  font-size: 13px;
  color: #777;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <div class="card" id="startScreen">

    <div class="language-buttons">
      <button onclick="setLanguage('en')" id="enBtn">English</button>
      <button onclick="setLanguage('hi')" id="hiBtn">हिन्दी</button>
      <button onclick="setLanguage('bn')" id="bnBtn">বাংলা</button>
    </div>

    <h1 id="title">Know Yourself 🌱</h1>

    <p class="subtitle" id="description">
      Discover your personality through your choices.
    </p>

    <label id="nameLabel">Enter your name</label>

    <input
      type="text"
      id="nameInput"
      placeholder="Your name"
    >

    <button onclick="startQuiz()" id="startButton">
      Start Quiz
    </button>

  </div>


  <div class="card hidden" id="quizScreen">

    <div id="questions"></div>

    <button onclick="finishQuiz()" id="submitButton">
      See My Result
    </button>

  </div>


  <div class="card hidden result" id="resultScreen">

    <h1 id="resultTitle">Your Result</h1>

    <p id="resultName"></p>

    <div class="score" id="mainScore"></div>

    <p id="resultDescription"></p>

    <div id="traits"></div>

    <button onclick="location.reload()" id="restartButton">
      Take Again
    </button>

  </div>

</div>

result:"Your Result",
again:"Take Again"
},

hi:{
title:"खुद को जानें 🌱",
description:"अपने चुनावों के माध्यम से अपने व्यक्तित्व को जानें।",
name:"अपना नाम दर्ज करें",
placeholder:"आपका नाम",
start:"क्विज़ शुरू करें",
submit:"मेरा परिणाम देखें",
result:"आपका परिणाम",
again:"फिर से करें"
},

bn:{
title:"নিজেকে জানুন 🌱",
description:"আপনার পছন্দের মাধ্যমে আপনার ব্যক্তিত্ব আবিষ্কার করুন।",
name:"আপনার নাম লিখুন",
placeholder:"আপনার নাম",
start:"কুইজ শুরু করুন",
submit:"আমার ফলাফল দেখুন",
result:"আপনার ফলাফল",
again:"আবার করুন"
}

};

function setLanguage(lang){

language = lang;

document.getElementById("enBtn").classList.remove("active");
document.getElementById("hiBtn").classList.remove("active");
document.getElementById("bnBtn").classList.remove("active");

document.getElementById(lang+"Btn").classList.add("active");

document.getElementById("title").innerText = text[lang].title;
document.getElementById("description").innerText = text[lang].description;
document.getElementById("nameLabel").innerText = text[lang].name;
document.getElementById("nameInput").placeholder = text[lang].placeholder;
document.getElementById("startButton").innerText = text[lang].start;
document.getElementById("submitButton").innerText = text[lang].submit;
document.getElementById("resultTitle").innerText = text[lang].result;
document.getElementById("restartButton").innerText = text[lang].again;

if(!document.getElementById("quizScreen").classList.contains("hidden")){
  renderQuestions();
}

}

function startQuiz(){

userName = document.getElementById("nameInput").value.trim();

if(!userName){
  alert(
    language === "hi"
    ? "कृपया अपना नाम दर्ज करें।"
    : language === "bn"
    ? "অনুগ্রহ করে আপনার নাম লিখুন।"
    : "Please enter your name."
  );
  return;
}

document.getElementById("startScreen").classList.add("hidden");
document.getElementById("quizScreen").classList.remove("hidden");

renderQuestions();

window.scrollTo(0,0);

}

function renderQuestions(){

const container = document.getElementById("questions");

container.innerHTML = "";

questions.forEach((question,index)=>{

const div = document.createElement("div");

div.className = "question";

let html = `<h3>${index+1}. ${question.q[language]}</h3>`;

question.options.forEach((option,optIndex)=>{

html += `
<label class="option">
<input type="radio" name="q${index}" value="${optIndex}">
${option.text[language]}
</label>
`;

});

div.innerHTML = html;

container.appendChild(div);

});

}

function finishQuiz(){

let selected = [];

for(let i=0;i<questions.length;i++){

const answer = document.querySelector(
`input[name="q${i}"]:checked`
);

if(!answer){

alert(
language === "hi"
? "कृपया सभी प्रश्नों का उत्तर दें।"
: language === "bn"
? "অনুগ্রহ করে সব প্রশ্নের উত্তর দিন।"
: "Please answer all questions."
);

return;

}

selected.push(
questions[i].options[parseInt(answer.value)]
);

}

let traits = {
positive:0,
negative:0,
kind:0,
empathy:0,
resilience:0,
emotional:0,
selfaware:0
};

selected.forEach(answer=>{

answer.traits.forEach(trait=>{
traits[trait]++;
});

});

const maxScore = questions.length;

const positivePercent =
Math.round((traits.positive/maxScore)*100);

const negativePercent =
Math.round((traits.negative/maxScore)*100);

const kindPercent =
Math.round((traits.kind/maxScore)*100);

const empathyPercent =
Math.round((traits.empathy/maxScore)*100);

const resiliencePercent =
Math.round((traits.resilience/maxScore)*100);

const emotionalPercent =
Math.round((traits.emotional/maxScore)*100);

const selfawarePercent =
Math.round((traits.selfaware/maxScore)*100);

let mainResult;

if(empathyPercent >= 60){
mainResult = language==="hi"
? "आप बहुत सहानुभूतिशील व्यक्ति हैं 💚"
: language==="bn"
? "আপনি একজন খুব সহানুভূতিশীল মানুষ 💚"
: "You are a highly empathetic person 💚";
}
else if(positivePercent >= 60){
mainResult = language==="hi"
? "आप एक आशावादी व्यक्ति हैं ☀️"
: language==="bn"
? "আপনি একজন আশাবাদী মানুষ ☀️"
: "You are an optimistic person ☀️";
}
else if(negativePercent >= 60){
mainResult = language==="hi"
? "आपमें थोड़ा अधिक नकारात्मक सोचने की प्रवृत्ति हो सकती है 🌧️"
: language==="bn"
? "আপনার মধ্যে কিছুটা নেতিবাচকভাবে চিন্তা করার প্রবণতা থাকতে পারে 🌧️"
: "You may have a tendency toward negative thinking 🌧️";
}
else{
mainResult = language==="hi"
? "आप एक संतुलित सोच वाले व्यक्ति हैं ⚖️"
: language==="bn"
? "আপনি ভারসাম্যপূর্ণভাবে চিন্তা করেন ⚖️"
: "You have a balanced way of thinking ⚖️";
}

document.getElementById("quizScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

document.getElementById("resultName").innerText =
userName;

document.getElementById("mainScore").innerText =
Math.round(
(positivePercent + kindPercent + empathyPercent + resiliencePercent + selfawarePercent)
/
5
) + "%";

document.getElementById("resultDescription").innerText =
mainResult;

const traitsContainer =
document.getElementById("traits");

traitsContainer.innerHTML = "";

addTrait("☀️ Positivity",positivePercent);
addTrait("💚 Kindness",kindPercent);
addTrait("🤝 Empathy",empathyPercent);
addTrait("💪 Resilience",resiliencePercent);
addTrait("🧘 Emotional control",100-emotionalPercent);
addTrait("🪞 Self-awareness",selfawarePercent);
addTrait("🌧️ Negative thinking",negativePercent);

window.scrollTo(0,0);

}

function addTrait(name,value){

const div = document.createElement("div");

div.className = "trait";

div.innerHTML = `
<div class="trait-name">${name}: ${value}%</div>
<div class="bar">
<div class="bar-fill" style="width:${value}%"></div>
</div>
`;

document.getElementById("traits").appendChild(div);

}

setLanguage("en");

</script>

</body>
  </html>
